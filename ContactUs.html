<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Élan Fitness | Salle de sport à Casablanca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

</head>
<body>
  <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="#accueil" class="logo">Élan Fitness</a>

      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="./Accueil.html" >Accueil</a></li>
          <li><a href="./About.html">À propos</a></li>
          <li><a href="./Programmes.html">Programmes</a></li>
          <li><a href="./ContactUs.html">Contactez Nous</a></li>
        </ul>
      </nav> 
    </div>
  </header>
  <form>
    <div>
      <label>Entrer votre nom</label>
      <input type="text" />
    </div>
    <div>
      <label>Entrez votre prenom:</label>
      <input type="text" />
    </div>
    <div>
      <label>Choisissez un programme</label>
      <select>
        <option>Musculation</option>
        <option>Yoga</option>
        <option>Cardio training</option>
        <option>Boxe fitness</option>
      </select>
    </div>
    <div>
      <label>Choisissez un plan</label>
      <select>
      <option>Essentiel</option>
      <option>Premium</option>
      <option>Duo</option>
      </select>
    </div>
  </form>
  <footer class="pied-de-page">
    <div class="conteneur">

      <div class="pied-haut">
        <div>
          <p class="logo logo-clair">Élan Fitness</p>
          <p class="slogan">Ton énergie, ton rythme.</p>
        </div>

        <nav aria-label="Navigation du pied de page">
          <ul class="menu menu-pied">
            <li><a href="#accueil">Accueil</a></li>
            <li><a href="#a-propos">À propos</a></li>
            <li><a href="#programmes">Programmes</a></li>
          </ul>
        </nav>
      </div>

      <div class="pied-bas">
        <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
        <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
      </div>

    </div>
